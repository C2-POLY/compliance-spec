spec_version: "0.2"
id: table-bookings
name: Table bookings
purpose: Take, confirm, remind and secure table bookings made by guests.
joint_controllers: []
data_subjects: [restaurant guests]
legal_basis: contract
legal_basis_detail:
  reference: "Booking terms accepted by the guest when booking a table, section 3; dietary notes are optional and asked with the guest's explicit consent (Art. 9(2)(a))"
dpia:
  required: "yes"
  criteria: [evaluation, sensitive]
  ref: "DPIA-2026-01, table bookings (dpia/table-bookings.pdf)"
information:
  notices:
    - {repo: bistro-web, id: privacy-page}
  text: The booking confirmation email repeats the link to the privacy page.
sensitive_data: [health, religious]
services:
  - repo: bistro-web
    data: [booking-form]
    recipients: []
  - repo: bistro-api
    data: [guest-contact, booking-details, payment-reference, no-show-history, request-metadata]
    recipients: [calendar-link, charge-deposit, mailrelay, paygate, send-email, send-sms, textflow-sms]
security_measures:
  - {measure: Data encrypted in transit (TLS) and at rest, source: {kind: declared, ref: "docs/security.md"}}
  - {measure: Back office access limited to restaurant staff with individual accounts, source: {kind: declared, ref: "docs/security.md"}}
recipients:
  - {name: TextFlow SMS (SMS reminders), source: {kind: declared, ref: "services/bistro-api/manifest.yaml"}}
  - {name: MailRelay (email confirmations), source: {kind: declared, ref: "services/bistro-api/manifest.yaml"}}
  - {name: PayGate (card deposits), source: {kind: declared, ref: "services/bistro-api/manifest.yaml"}}
retention:
  duration: P3Y
  trigger: after the last booking of the guest
  source: {kind: declared, ref: "records of processing policy"}
source: {kind: declared, ref: "operations team"}
