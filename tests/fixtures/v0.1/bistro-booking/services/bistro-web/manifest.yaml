spec_version: "0.1"

service:
  name: Bistro Booking Web
  repo: bistro-org/bistro-web
  description: Booking website of Bistro Booking, the frontend that guests use to book a table.
  controller: organisation
  source: {kind: declared, ref: "README.md"}

personal_data:
  - id: booking-form
    subjects: [restaurant guests]
    fields:
      - {name: guest name, category: identity}
      - {name: guest email, category: contact}
      - {name: guest phone number, category: contact}
      - {name: dietary notes (free text), category: special}
    purpose: collect the data of a table booking and send it to the booking API
    legal_basis: contract
    source: {kind: code, ref: "src/components/BookingForm.tsx"}
    linked_files: ["src/components/BookingForm.tsx"]

  - id: visit-statistics
    subjects: [visitors of the website]
    fields:
      - {name: pseudonymous visitor id, category: usage}
      - {name: pages viewed, category: usage}
    purpose: measure which pages are used
    legal_basis: consent
    source: {kind: code, ref: "src/analytics/beacon.ts"}
    linked_files: ["src/analytics/**"]

storage:
  - id: booking-draft
    kind: browser
    location: sessionStorage of the guest's browser
    data: [booking-form]
    retention: {duration: session, trigger: the browser tab is closed}
    source: {kind: code, ref: "src/components/BookingForm.tsx"}

  - id: consent-cookie
    kind: browser
    location: first-party cookie in the visitor's browser
    data: [visit-statistics]
    retention: {duration: P6M, trigger: expiry of the cookie}
    source: {kind: code, ref: "src/analytics/consent.ts"}

processors:
  - id: pagestats
    name: PageStats
    service: website audience measurement
    country: DE
    dpa: "yes"
    transfer_outside_eu: false
    data: [visit-statistics]
    source: {kind: code, ref: "src/analytics/beacon.ts"}

outbound_flows:
  - id: submit-booking
    to: {name: Bistro Booking API, country: FR}
    data: [booking-form]
    purpose: create the booking
    account: none
    source: {kind: code, ref: "src/api/client.ts"}

  - id: analytics-beacon
    to: {name: PageStats, country: DE}
    data: [visit-statistics]
    purpose: send page views once the visitor has consented
    account: organisation
    source: {kind: code, ref: "src/analytics/beacon.ts"}

automated_decisions: []

ai_features: []

linked_files:
  - "src/components/BookingForm.tsx"
  - "src/analytics/**"
  - "src/api/**"
