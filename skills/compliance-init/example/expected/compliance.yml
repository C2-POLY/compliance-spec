# .github/workflows/compliance.yml
# Example output. The `<full-sha>` placeholders stand for the pinned commit SHAs the skill resolves with `gh api`.

name: Compliance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<full-sha> # v5
        with:
          persist-credentials: false
      # TODO: pin to the commit of the v1 tag once it exists (until then, the SHA of main)
      - uses: C2-POLY/compliance-action@<full-sha> # v1
        with:
          mode: check

  send:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: compliance # restricted to the default branch (Settings > Environments)
    steps:
      - uses: actions/checkout@<full-sha> # v5
        with:
          fetch-depth: 0 # the lag needs the full history
          persist-credentials: false

      - id: token
        uses: actions/create-github-app-token@<full-sha> # v2
        with:
          app-id: ${{ vars.COMPLIANCE_APP_ID }}
          private-key: ${{ secrets.COMPLIANCE_APP_PRIVATE_KEY }}
          owner: bistro-org
          repositories: bistro-compliance
          permission-contents: write

      # TODO: pin to the commit of the v1 tag once it exists (until then, the SHA of main)
      - uses: C2-POLY/compliance-action@<full-sha> # v1
        with:
          mode: send
          compliance-repo: bistro-org/bistro-compliance
          token: ${{ steps.token.outputs.token }}
