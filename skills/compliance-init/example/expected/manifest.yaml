spec_version: "0.2"

service:
  name: Bistro Booking API
  repo: bistro-org/bistro-api
  description: Booking API of Bistro Booking, a table booking app for restaurants. It takes table bookings, reminds guests by SMS and drafts replies to guests' questions with an AI assistant.
  controller: organisation # declared: question 1, engineering lead
  source: {kind: declared, ref: "README.md; controller answered by the engineering lead during compliance-init"}

personal_data:
  - id: guest-contact
    subjects: [restaurant guests]
    fields:
      - {name: guest full name, category: identity}
      - {name: guest email address, category: contact}
      - {name: guest phone number, category: contact}
    purpose: identify guests and send them booking reminders by SMS
    legal_basis: contract # declared: question 3, engineering lead
    source: {kind: code, ref: "src/guests/model.ts"}

  - id: dietary-notes
    subjects: [restaurant guests]
    fields:
      - {name: guest dietary notes (free text), category: special}
    purpose: record the dietary needs a guest mentions
    legal_basis: consent # declared: question 3, engineering lead
    source: {kind: code, ref: "src/guests/model.ts"}

  - id: booking-details
    subjects: [restaurant guests]
    fields:
      - {name: party size, category: usage}
      - {name: booking date and time, category: usage}
    purpose: manage table bookings
    legal_basis: contract # declared: question 3, engineering lead
    source: {kind: code, ref: "migrations/001.sql"}

  - id: assistant-questions
    subjects: [restaurant guests]
    fields:
      - {name: guest question to the restaurant (free text), category: unknown}
    purpose: draft a reply to a guest's question
    legal_basis: contract # declared: question 3, engineering lead
    source: {kind: code, ref: "src/assistant/suggest.ts"}

  - id: request-metadata
    subjects: [restaurant guests]
    fields:
      - {name: IP address of the guest's request, category: connection}
      - {name: browser user agent and other technical headers, category: connection}
    purpose: receive the booking requests guests send from the booking form
    legal_basis: contract # declared: question 3, engineering lead
    source: {kind: code, ref: "src/guests/routes.ts"}

storage:
  - id: main-db
    kind: database
    location: PostgreSQL, EU region (Frankfurt) # region declared: question 4, engineering lead
    data: [guest-contact, dietary-notes, booking-details]
    retention: {duration: P3Y, trigger: after the last booking of the guest} # declared: question 4, engineering lead
    source: {kind: code, ref: "src/db.ts, migrations/001.sql"}

  - id: app-logs
    kind: log
    location: standard output of the API, collected by the log service of the hosting provider # declared: question 4, engineering lead
    data: [guest-contact]
    retention: {duration: P30D, trigger: log rotation} # declared: question 4, engineering lead
    source: {kind: code, ref: "src/notifications/sms.ts"}

processors:
  - id: textflow-sms
    name: TextFlow SMS
    service: SMS booking reminders
    country: NL # declared: question 5, engineering lead
    dpa: "yes" # declared: question 6, engineering lead
    dpa_ref: "TextFlow SMS data processing agreement, signed 2025-09-02" # declared: question 6, engineering lead
    transfer_outside_eu: false # follows from the country declared in question 5
    data: [guest-contact]
    source: {kind: code, ref: "src/notifications/sms.ts"}

  - id: chatloom
    name: ChatLoom
    service: AI drafts of replies to guests' questions
    country: US # declared: question 5, engineering lead
    dpa: unknown # declared: question 6, engineering lead ("not known")
    transfer_outside_eu: true # follows from the country declared in question 5; safeguard not known, left out
    data: [guest-contact, assistant-questions]
    source: {kind: code, ref: "src/assistant/suggest.ts"}

outbound_flows:
  - id: send-sms
    to: {name: TextFlow SMS, country: NL} # country declared: question 5
    data: [guest-contact]
    purpose: send the booking reminder by SMS
    account: organisation # confirmed: question 7, engineering lead
    processor: textflow-sms
    source: {kind: code, ref: "src/notifications/sms.ts"}

  - id: ask-assistant
    to: {name: ChatLoom, country: US} # country declared: question 5
    data: [guest-contact, assistant-questions]
    purpose: get an AI draft of a reply to a guest's question
    account: organisation # confirmed: question 7, engineering lead
    processor: chatloom
    source: {kind: code, ref: "src/assistant/suggest.ts"}

automated_decisions: []

ai_features:
  - id: reply-drafting
    description: A language model drafts a reply to a guest's question from the guest's name and the question. Staff edit and send the reply from the back office.
    generates_content: true
    interacts_with_persons: false
    human_review: true # inferred from the code (the draft is only returned to the back office); to confirm
    # marking: none. Declared in question 9: guests are not told, staff send the reply in their own name.
    role: to-assess # question 9: not known yet (deployer of ChatLoom's model, or provider of the drafting feature)
    risk: {level: limited, reason: "Drafts replies that staff edit and send; it decides nothing about the guest."} # declared: question 9, engineering lead
    obligations:
      - {id: art4-ai-literacy, status: open} # not in the code; to confirm
      - {id: art50-synthetic-content, status: open} # the code does not mark the draft as AI-generated; to confirm
    data: [guest-contact, assistant-questions]
    source: {kind: code, ref: "src/assistant/suggest.ts"}

notices:
  - id: privacy-page
    kind: page
    ref: https://bistro-booking.example/privacy # declared: question 8, engineering lead
    source: {kind: declared, ref: "answered by the engineering lead during compliance-init"}

linked_files:
  - "src/guests/**"
  - "src/db.ts"
  - "src/notifications/sms.ts"
  - "src/assistant/suggest.ts"
  - "migrations/001.sql"
  - "package.json"
