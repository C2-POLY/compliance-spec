# Machine-readable mapping of the compliance step: trigger id -> questions -> manifest field path.
# Explained in triggers.md. Every path is checked against the v0.2 schemas by scripts/check-triggers.mjs.
# `field` is the main path the answer fills; `also` lists other paths the same answer settles.
# `processing` lists paths of processing.yaml (compliance repo) the answer feeds: written to the Compliance section, not to the manifest.
triggers:
  - id: a
    name: New personal data field
    questions:
      - id: a1
        text: What is the new data, and is it identity, contact, financial, location, usage, professional, connection, health, special or credential data?
        field: personal_data[].fields[].category
        also:
          - personal_data[].fields[].name
      - id: a2
        text: Whose data is it (guests, staff, other)?
        field: personal_data[].subjects
      - id: a3
        text: Why is it collected, in one sentence?
        field: personal_data[].purpose
      - id: a4
        text: On what legal basis (consent, contract, legal obligation, legitimate interests, other, or not known yet), and what supports it (the contract or law relied on, why our interest outweighs the person's, or how consent is collected and withdrawn)?
        field: personal_data[].legal_basis
        processing:
          - legal_basis_detail.reference
          - legal_basis_detail.balancing_test
          - legal_basis_detail.consent
  - id: b
    name: New external service or recipient
    questions:
      - id: b1
        text: What is the provider called, and what does it do for us?
        field: processors[].name
        also:
          - processors[].service
          - outbound_flows[].to.name
          - outbound_flows[].processor
      - id: b2
        text: In which country does it process the data, and if that is outside the EU/EEA, which safeguard covers the transfer?
        field: processors[].country
        also:
          - processors[].transfer_outside_eu
          - processors[].safeguard
          - outbound_flows[].to.country
          - outbound_flows[].safeguard
      - id: b3
        text: Is a data processing agreement signed with it (yes, no, unknown), and where is it (the signed agreement or the provider's standard terms)?
        field: processors[].dpa
        also:
          - processors[].dpa_ref
      - id: b4
        text: Which personal data is sent to it?
        field: processors[].data
        also:
          - outbound_flows[].data
  - id: c
    name: New storage or retention change
    questions:
      - id: c1
        text: Where is the data stored (kind of store, product, region)?
        field: storage[].location
        also:
          - storage[].kind
      - id: c2
        text: Which personal data does it hold?
        field: storage[].data
      - id: c3
        text: How long is the data kept (a duration, until the user removes it, or unknown)?
        field: storage[].retention.duration
      - id: c4
        text: What event starts the clock or ends the retention?
        field: storage[].retention.trigger
  - id: d
    name: Automated decision or AI feature
    questions:
      - id: d1
        text: What does the system decide or generate, and who is affected?
        field: automated_decisions[].description
        also:
          - ai_features[].description
      - id: d2
        text: Does the decision have a legal effect or a similarly significant effect on the person?
        field: automated_decisions[].legal_or_similar_effect
      - id: d3
        text: Can a human review or override the result before it takes effect?
        field: automated_decisions[].human_review
        also:
          - ai_features[].human_review
      - id: d4
        text: If persons talk to an AI or see AI-generated content, how are they told it is AI?
        field: ai_features[].marking
        also:
          - ai_features[].interacts_with_persons
          - ai_features[].generates_content
  - id: e
    name: Notice to persons
    questions:
      - id: e1
        text: What tells the persons about their data here (a privacy page, an in-app screen, a consent banner, an email), or is there nothing yet?
        field: notices[].kind
      - id: e2
        text: Where is it (a URL, a file path or a screen name), and which part of the service shows it?
        field: notices[].ref
        also:
          - notices[].component
  - id: f
    name: AI role or risk change
    questions:
      - id: f1
        text: Do we build or fine-tune the AI system, or put it into service under our own name (provider), or use someone else's system as it is (deployer), or not known yet?
        field: ai_features[].role
      - id: f2
        text: What is the AI used for, and does that make it high risk (decisions about hiring, credit, education, access to essential services...), limited (it talks to persons or generates content), minimal, or not known yet? Why?
        field: ai_features[].risk.level
        also:
          - ai_features[].risk.reason
      - id: f3
        text: Which AI duties are already met, and where (staff trained on AI, persons told they talk to an AI, generated content marked as such)?
        field: ai_features[].obligations[].status
        also:
          - ai_features[].obligations[].id
          - ai_features[].obligations[].ref
